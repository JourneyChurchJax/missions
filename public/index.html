<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Journey Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:ital,wght@0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f7f4f0; --sand:#ece7df; --ink:#0a0a0a; --muted:#5a574f; --ember:#ff3a3a; --raised:#fbf9f6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--cream); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; display: grid; place-items: center; padding: 24px; }
  .card { width: 100%; max-width: 560px; background: var(--raised); border-radius: 28px; padding: 48px 40px; box-shadow: 0 1px 2px rgba(10,10,10,.06), 0 16px 40px rgba(10,10,10,.10); display: flex; flex-direction: column; gap: 20px; }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font: 800 22px/1 'Inter Tight', Inter, sans-serif; letter-spacing: -.035em; }
  .brand span { font-size: 11.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 0; font: 800 clamp(2.5rem, 8vw, 3.5rem)/.95 'Inter Tight', Inter, sans-serif; letter-spacing: -.035em; }
  h1 em { font-weight: 700; letter-spacing: -.03em; }
  p { margin: 0; color: var(--muted); }
  a.btn { align-self: flex-start; height: 48px; padding: 0 24px; border-radius: 999px; background: var(--ember); color: var(--ink); display: inline-flex; align-items: center; text-decoration: none; font-weight: 700; transition: transform .12s cubic-bezier(.2,.7,.2,1); }
  a.btn:active { transform: scale(.98); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><b>Journey</b><span>Missions</span></div>
    <h1>Almost <em>ready</em>.</h1>
    <p>We're building a new home for Journey Church mission trips: trip details, team schedules, documents and giving, all in one place.</p>
    <a class="btn" href="https://www.journeychurch.org">Back to journeychurch.org</a>
  </main>
</body>
</html>
